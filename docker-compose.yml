name: swiss-knife

services:
  swiss-knife-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swiss-knife-hub
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 512m
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,nosuid,nodev
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - BIND_HOST=0.0.0.0
      - DOMAIN=${DOMAIN:-}
      - ONION_DOMAIN=${ONION_DOMAIN:-}
      - DB_PATH=${DB_PATH:-/app/data/hub_db.json}
      - SECURITY_SECRET=${SECURITY_SECRET:-}
    volumes:
      - hub_data:/app/data
    networks:
      - tor_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Tor v3 Hidden Service (.onion)
  # Retrieve the generated v3 .onion hostname once containers are healthy:
  #   docker exec swiss-knife-tor cat /var/lib/tor/hidden_service/hub/hostname
  # IMPORTANT: Back up the `tor_keys` volume to keep the same .onion address across server migrations.
  tor:
    image: goldy/tor-hidden-service:latest
    container_name: swiss-knife-tor
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 64
    environment:
      # Maps external port 80 on your .onion address to swiss-knife-hub:3000
      HUB_TOR_SERVICE_HOSTS: 80:swiss-knife-hub:3000
      HUB_TOR_SERVICE_VERSION: "3"
    volumes:
      - tor_keys:/var/lib/tor/hidden_service/
    networks:
      - tor_net
    depends_on:
      swiss-knife-hub:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hub_data:
  tor_keys:

networks:
  tor_net:
    driver: bridge
